name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 22

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Astro site
        run: npm run build

      - name: Start ssh agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_KEY }}

      - name: Add cPanel host key
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$CPANEL_PORT" "$CPANEL_HOST" >> ~/.ssh/known_hosts

      - name: Deploy frontend to cPanel
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          CPANEL_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_DIR: ${{ secrets.CPANEL_FRONTEND_DIR }}
        run: |
          set -euo pipefail

          archive="/home/$CPANEL_USER/.tuneboss-${GITHUB_SHA}.tar.gz"
          tar -C dist -czf site.tar.gz .
          ssh -p "$CPANEL_PORT" "$CPANEL_USER@$CPANEL_HOST" "cat > '$archive'" < site.tar.gz

          ssh -p "$CPANEL_PORT" "$CPANEL_USER@$CPANEL_HOST" \
            "bash -s -- '$CPANEL_DIR' '$archive' '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail

          target=$1
          archive=$2
          stage="/home/$(whoami)/.tuneboss-stage-$3"
          expected="/home/$(whoami)/public_html"

          [ "$target" = "$expected" ] || {
            echo "Refusing unsafe deploy target: $target"
            exit 1
          }

          trap 'rm -rf -- "$stage"; rm -f -- "$archive"' EXIT
          rm -rf -- "$stage"
          mkdir -p "$stage" "$target"
          tar -xzf "$archive" -C "$stage"
          test -f "$stage/index.html"

          find "$target" -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec rm -rf -- {} +
          cp -a "$stage/." "$target/"
          REMOTE
